; chat_server_full 示例配置；删除后使用内置默认值。
; 测试心跳/超时可用 --config 指向另一份更短的配置。
[chat]
host = 127.0.0.1
port = 9200
max_peers = 64
heartbeat_ms = 500
peer_timeout_ms = 10000
app_ping_interval_ms = 2000
app_session_timeout_ms = 8000
reconnect_grace_ms = 60000
max_message_bytes = 1024
replay_lines = 20
history_file = /tmp/go2cpp_chat_history.log

[logging]
file = /tmp/go2cpp_chat_server_full.log
level = info
