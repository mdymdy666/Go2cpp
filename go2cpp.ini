# Go2Cpp 默认配置。加载后统一校验，非法配置不会启动运行时。
[scheduler]
# 0 自动使用硬件并发数；显式范围 1..32。
processor_count = 0
# 初始 M 数量；0 交给调度器按需决定。
min_workers = 0
# 最大 M 数量；0 使用调度器默认上限，显式范围 1..32。
max_workers = 0
# 每个 P 的本地队列容量，必须大于 0。
local_queue_limit = 256
# Fiber 初始栈大小；0 使用后端默认值。
fiber_stack_size = 0
# 同类任务的亲和预算；更大减少迁移但可能降低均衡。
task_affinity_budget = 4
# 允许声明阻塞区的 M 临时超过 P。
allow_worker_oversubscription = true
# 开启已声明阻塞区的 sysmon 观察线程。
enable_sysmon = true
# sysmon 周期（毫秒）；过小增加开销，过大延迟发现阻塞。
sysmon_interval_ms = 10
# 长系统调用阈值（毫秒），仅用于诊断和解绑提示。
long_syscall_threshold_ms = 50
# 是否将 M 绑定到 CPU；容器通常保持 false。
pin_workers_to_cpu = false

[log]
# 发布默认 warn；可选 trace/debug/info/warn/error/critical/off。
level = warn
# 默认 false；true 时同时输出 stdout。
stdout = false
# 相对当前进程工作目录，默认项目根目录下的 log/。
directory = log
file = go2cpp.log
# 可用标记：{time} {level} {logger} {thread} {fiber} {file} {line} {function} {message}。
format = {time} [{level}] {logger} ({file}:{line}) {message}\n
